<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .website {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .website-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cloud Drive</h1>

    <table>
        <thead>
            <tr>
                <th>Website</th>
                <th>Address</th>
                <th>Purpose of Use</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>
                    <div class="website">
                        <img
                            class="website-logo"
                            src="https://www.sync.com/hubfs/sync-logo-color.svg"
                            alt="Sync Logo"
                        >
                        <span>Sync</span>
                    </div>
                </td>

                <td>
                    <a
                        href="https://www.sync.com"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        https://www.sync.com
                    </a>
                </td>

                <td>Cloud Drive</td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
